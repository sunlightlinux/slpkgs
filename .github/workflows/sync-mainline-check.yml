# Keep mainline-check an exact mirror of void-packages' master:
#   void-linux/void-packages master -> mainline-check
#
# Fast-forward only, so mainline-check keeps Void's own commit hashes and
# Sunlight's changes live on a branch built on top of it. If mainline-check
# ever holds a commit Void does not have, the job fails instead of merging:
# nothing is supposed to be committed there.
#
# Lives on the default branch because scheduled workflows only run from
# there. void-packages is small enough (~270 MB) to clone in full, so the
# push can send whatever slpkgs lacks without fetching blobs on demand.
#
# One push of the whole history broke off after 12 minutes ("RPC failed;
# curl 92 HTTP/2 stream ... CANCEL"). So a large update - the first run, or
# one after a long gap - is pushed in steps of STEP_COMMITS first-parent
# commits, each a fast-forward of the last, over HTTP/1.1. A day's update
# is a single small push.
#
# The push needs the SLPKGS_SYNC_TOKEN secret, not GITHUB_TOKEN: Void's
# history adds and edits files under .github/workflows/, and GitHub refuses
# such commits from a token without the "workflows" permission, which
# GITHUB_TOKEN cannot be given. Use a fine-grained token for this repository
# only, with Contents and Workflows read/write. Void's own workflows do not
# run here: build.yaml fires on ci-** branches, container.yaml on master,
# and scheduled ones only from the default branch, where they do not exist.

name: Sync void-packages

on:
  schedule:
    # Twice a day: GitHub starts scheduled runs late, and sometimes skips
    # them for days. A run with nothing new does nothing.
    - cron: '30 3 * * *'
    - cron: '30 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-mainline-check
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/void-linux/void-packages.git
  UPSTREAM_BRANCH: master
  TARGET_BRANCH: mainline-check
  STEP_COMMITS: 20000

jobs:
  sync:
    name: void-packages master -> mainline-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clone void-packages
        run: |
          git clone --bare --single-branch --no-tags \
            --branch "$UPSTREAM_BRANCH" "$UPSTREAM_URL" repo.git

      - name: Fast-forward and push
        working-directory: repo.git
        env:
          GH_TOKEN: ${{ secrets.SLPKGS_SYNC_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The SLPKGS_SYNC_TOKEN secret is not set; see the comment at the top of this workflow."
            exit 1
          fi
          git remote add slpkgs \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          upstream=$(git rev-parse "refs/heads/${UPSTREAM_BRANCH}")
          target=$(git ls-remote slpkgs "refs/heads/${TARGET_BRANCH}" | cut -f1)

          if [ "$target" = "$upstream" ]; then
            echo "${TARGET_BRANCH} is already at void-packages ${UPSTREAM_BRANCH} (${upstream:0:12})."
            exit 0
          fi

          if [ -n "$target" ]; then
            # Needed locally to tell a fast-forward from a divergence.
            git fetch --no-tags slpkgs "refs/heads/${TARGET_BRANCH}"
            if ! git merge-base --is-ancestor "$target" "$upstream"; then
              echo "::error::${TARGET_BRANCH} (${target:0:12}) has commits that void-packages ${UPSTREAM_BRANCH} does not; it must stay a mirror. Move them to another branch."
              exit 1
            fi
            echo "Fast-forwarding ${TARGET_BRANCH}: $(git rev-list --count "${target}..${upstream}") new commit(s)."
          else
            echo "Creating ${TARGET_BRANCH} at void-packages ${UPSTREAM_BRANCH} (${upstream:0:12})."
          fi

          push() {
            git -c http.version=HTTP/1.1 -c http.postBuffer=524288000 \
              push slpkgs "$1:refs/heads/${TARGET_BRANCH}"
          }

          range="$upstream"
          [ -n "$target" ] && range="${target}..${upstream}"
          for step in $(git rev-list --reverse --first-parent "$range" |
                          awk -v n="$STEP_COMMITS" 'NR % n == 0'); do
            echo "Step: ${TARGET_BRANCH} -> ${step:0:12}"
            push "$step"
          done
          push "$upstream"
