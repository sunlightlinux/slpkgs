<?xml version="1.0"?> <!--*-nxml-*-->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
        "https://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<!--
  D-Bus policy for slinit-logind's org.freedesktop.systemd1 compat
  stub.

  IMPORTANT: this policy has NO `<deny>` rules, only `<allow>`. That's
  deliberate. dbus-daemon applies policy per BUS CONNECTION (not
  per-name); since slinit-logind holds both `org.freedesktop.login1`
  AND `org.freedesktop.systemd1` on the same connection, any deny
  targeting systemd1 also blocks a subset of login1 traffic through
  the shared match graph (an unprivileged caller's login1.CanReboot
  call gets rejected because the deny for systemd1 fires against the
  connection, and no later allow explicitly re-permits it).
  Empirically: our elogind-shaped default-deny+per-method-allow policy
  in an earlier revision made `xfce4-session`'s Restart button prompt
  for the root password instead of proceeding — polkit thought the
  active local session couldn't invoke login1.Reboot, because dbus
  denied the CanReboot precheck.

  The stub is inert (SetEnvironment stores in-memory, StartUnit
  returns a fake job, all Lists return []), so opening it wide has no
  security impact. Access control for real destructive systemd1
  actions would need enforcement in the daemon, not the bus policy.

  When a real systemd is ever swapped in on the same host (e.g. a
  Sunlight-to-systemd migration), this file becomes redundant —
  systemd ships its own org.freedesktop.systemd1.conf that will win
  by file-order.
-->

<busconfig>

        <policy user="root">
                <allow own="org.freedesktop.systemd1"/>
        </policy>

        <policy context="default">
                <allow send_destination="org.freedesktop.systemd1"/>
                <allow receive_sender="org.freedesktop.systemd1"/>
        </policy>

</busconfig>
