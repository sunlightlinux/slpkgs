# Configuration for the turnstile slinit backend
# (Sunlight/slinit-native adaptation of Chimera's dinit backend).
#
# Sourced by /usr/libexec/turnstile/slinit as POSIX shell. Every
# `slinit`-flavoured path variable here shadows the built-in default
# in that script; empty or unset means "keep the default".

# waits-for.d dir for the auto-generated `boot` target. User-managed
# — drop symlinks here to force a service to start before login
# completes (turnstile blocks pam_turnstile.so until $boot is up).
boot_dir="${HOME}/.config/slinit.d/boot.d"

# Same idea but system-managed: distro / sysadmin-installed symlinks
# in this path pull services into every user's boot graph.
system_boot_dir="/usr/lib/slinit.d/user/boot.d"

# Service description directories, in resolution order. Empty slots
# terminate the search — leave gaps in the numeric sequence and
# nothing after the gap is read.
services_dir1="${HOME}/.config/slinit.d"
services_dir2="/etc/slinit.d/user"
services_dir3="/usr/local/lib/slinit.d/user"
services_dir4="/usr/lib/slinit.d/user"
