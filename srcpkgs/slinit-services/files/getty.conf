# /etc/conf.d/getty — which consoles get a login prompt (slinit-services,
# read by the gettys service at boot).
#
# Virtual consoles and serial ports, without /dev/. A port that does not
# exist on this machine is skipped. A display manager or another getty
# (ngetty, say) that wants a console: take it out of this list.
ACTIVE_CONSOLES="tty1 ttyS0"

# Also give a prompt to the serial consoles the kernel was told to use
# (console=ttyS1,115200 on its command line). "no" to turn that off.
SERIAL_DETECT=yes
