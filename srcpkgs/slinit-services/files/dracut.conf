# slinit-services: what runit-void's 10-runit-void.conf did for dracut,
# for a system that boots slinit and has no runit-void.
#
# resume: hibernation. systemd: never in an initramfs for a system with
# no systemd. i18n_vars: carry the console keymap and font from
# /etc/rc.conf into the initramfs, so a LUKS passphrase prompt at boot
# uses the configured layout and not US.
add_dracutmodules+=" resume "
omit_dracutmodules+=" systemd "
i18n_vars="/etc/rc.conf:KEYMAP,FONT,FONT_MAP,FONT_UNIMAP"
